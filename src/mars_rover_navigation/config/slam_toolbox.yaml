# slam_toolbox — Online Asynchronous SLAM
# Tuned for Mars rover with 2D LiDAR on rough terrain

slam_toolbox:
  ros__parameters:
    # Mode: async processes scans as fast as possible without blocking
    mode: mapping

    # Sensor topics
    scan_topic: /scan
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Map parameters — fine resolution for terrain detail
    resolution: 0.05
    max_laser_range: 20.0
    minimum_travel_distance: 0.0     # publish first map immediately (no movement needed)
    minimum_travel_heading: 0.0      # publish first map immediately

    # Loop closure
    do_loop_closing: true
    loop_match_minimum_response_fine: 0.45
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.45
    link_scan_maximum_distance: 1.5

    # Scan buffer
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 10.0

    # Message filter queue — large buffer so map publishes never drop
    # when TF lookups are briefly delayed under simulation load
    message_filter_queue_size: 100

    # Map update
    map_update_interval: 1.0
    enable_interactive_mode: true

    # Transforms
    transform_publish_period: 0.02
    tf_buffer_duration: 30.0

    use_sim_time: true
